name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        precision: [float, double]
        specialize: ['', 'KF_SIZE(1,1)KF_SIZE(2,1)KF_SIZE(4,2)']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Debug
          -DKF_USE_DOUBLE=${{ matrix.precision == 'double' && 'ON' || 'OFF' }}
          "-DKF_SPECIALIZE=${{ matrix.specialize }}"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install arm-none-eabi-gcc and newlib
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      # Builds every Cortex-M4F benchmark image (kalman-c, specialized, naive,
      # TinyEKF). Running them needs QEMU with plugin headers; see CLAUDE.md.
      - name: Build Cortex-M4F firmware
        run: >
          cmake -S embedded -B build-fw
          -DCMAKE_TOOLCHAIN_FILE=$PWD/embedded/arm-none-eabi.cmake
          && cmake --build build-fw -j 4
