name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repository. (The release workflow is the
# only one with write access, and only tag pushes trigger it.)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        precision: [float, double]
        specialize: ['', 'KF_SIZE(1,1)KF_SIZE(2,1)KF_SIZE(4,2)']
        fxfrac: ['']
        include:
          # Fixed point in a non-default Q format.
          - compiler: gcc
            precision: float
            specialize: ''
            fxfrac: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Debug
          -DKF_USE_DOUBLE=${{ matrix.precision == 'double' && 'ON' || 'OFF' }}
          "-DKF_SPECIALIZE=${{ matrix.specialize }}"
          "-DKF_FX_FRAC=${{ matrix.fxfrac }}"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install arm-none-eabi-gcc and newlib
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      # Builds every Cortex-M4F benchmark image (kalman-c, specialized, naive,
      # TinyEKF). Running them needs QEMU with plugin headers; see CLAUDE.md.
      - name: Build Cortex-M4F firmware
        run: >
          cmake -S embedded -B build-fw
          -DCMAKE_TOOLCHAIN_FILE=$PWD/embedded/arm-none-eabi.cmake
          && cmake --build build-fw -j 4

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          # Pinned to the versions the code was checked with locally.
          pip install clang-tidy==22.1.8 clang-format==23.1.2
      - name: clang-format
        run: >
          clang-format --dry-run --Werror
          include/kalman/*.h src/*.c src/*.h tests/unit/*.c tests/comparison/*.c
          tests/scenarios/*.[ch] tests/baselines/*.[ch] bench/*.[ch] bench/runners/*.[ch]
          embedded/*.[ch] embedded/qemu/*.c examples/*.c tests/dist/*.c tests/dist/*.cpp
      - name: clang-tidy
        run: |
          for cfg in -UKF_SPECIALIZE "-DKF_SPECIALIZE=KF_SIZE(4,2)" -DKF_USE_DOUBLE; do
            clang-tidy --quiet src/*.c -- -std=c99 -Iinclude -Isrc "$cfg"
          done
      - name: cppcheck
        run: |
          for cfg in -UKF_SPECIALIZE "-DKF_SPECIALIZE=KF_SIZE(4,2)"; do
            cppcheck --std=c99 --enable=warning,style,performance,portability --inline-suppr \
              --error-exitcode=1 --suppress=missingIncludeSystem -Iinclude -Isrc "$cfg" src/
          done
      - name: MISRA C:2012 subset
        run: python3 scripts/check_misra.py

  benchmarks:
    # Guide Step 7: the comparison report, and a gate on speed regressions.
    # Instruction counts (valgrind) are deterministic for a given binary and
    # toolchain, so the runner image and compiler are pinned.
    runs-on: ubuntu-24.04
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Tests, with the comparison [report] lines
        run: |
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build -V --output-on-failure 2>&1 | tee ctest.log
      - name: Build the regression probes
        run: |
          cmake -B build-bench -DCMAKE_BUILD_TYPE=Release -DKF_BUILD_BENCH=ON -DKF_BUILD_TESTS=OFF
          cmake --build build-bench -j 4 --target regress
          cmake -B build-bench-spec -DCMAKE_BUILD_TYPE=Release -DKF_BUILD_BENCH=ON -DKF_BUILD_TESTS=OFF \
            "-DKF_SPECIALIZE=KF_SIZE(2,1)KF_SIZE(4,2)KF_SIZE(15,6)"
          cmake --build build-bench-spec -j 4 --target regress
      - name: Speed regression check (more than 10% slower than the last release fails)
        id: regression
        continue-on-error: true
        run: >
          python3 scripts/check_regression.py --build build-bench --build-spec build-bench-spec
          --markdown regression.md
      - name: Comparison report
        if: always()
        run: |
          python3 scripts/make_comparison_report.py ctest.log regression.md > comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: comparison-report
          path: |
            comparison.md
            results/regression-baseline.json
      - name: Fail on a speed regression
        if: steps.regression.outcome == 'failure'
        run: |
          echo "The speed regression check failed; see comparison.md."
          exit 1
